services:
  db:
    image: postgres:16-alpine
    container_name: pokedex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pokedex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokedex"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: pokedex-app
    build:
      context: .
      dockerfile: Dockerfile.multistage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pokedex
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: cambia-esto-por-un-secreto-largo-y-seguro
    ports:
      - "8080:8080"

volumes:
  pokedex_pgdata:

